# Funções chamadas pelo navegador do visitante (sem header de autenticação).
# verify_jwt = false é obrigatório, senão o <script>/beacon recebem 401.
[functions.loader]
verify_jwt = false

[functions.track]
verify_jwt = false

# Authorization is validated inside the handler (service role or logged-in user).
[functions.process-fb-event]
verify_jwt = false

[functions.analyze-events]
verify_jwt = true
